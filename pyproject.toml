[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-front-office"
version = "0.1.0"
description = "All-In-One NBA Fantasy Intelligence — AI-powered General Manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yahoofantasy>=1.4.9,<2",
    # Imported directly by config/settings.py; pulled in by pydantic-settings
    # too, but a direct import belongs in direct dependencies.
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "google-genai>=1.63.0,<2",
    "nba_api>=1.11.0,<2",
    # clients/nba/client.py catches requests' exception types by name to decide
    # what is retryable. nba_api depends on requests, but relying on that
    # transitively would break the retry policy if it ever swapped HTTP client.
    "requests>=2.32.0,<3",
    "pandas>=2.2.0,<3",
    "tenacity>=9.0.0,<10",
    "pyreadline3>=3.4,<4; sys_platform == 'win32'",
    # zoneinfo reads the OS tz database, which Windows does not ship. Without
    # this, ZoneInfo("America/Los_Angeles") raises ZoneInfoNotFoundError there.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
front-office = "the_front_office.main:main"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1,<2",
    "pytest>=8.0.0,<10",
    "ruff>=0.15.0,<1",
    "pre-commit>=4.0.0,<5",
    "pandas-stubs>=2.2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["the_front_office*"]
namespaces = false

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["./src"]
pythonVersion = "3.10"
reportMissingImports = false


[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (includes F401 unused imports)
    "I",      # isort — enforces the stdlib/third-party/local grouping in rules.md
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "TID252", # ban relative imports
]
ignore = [
    "E501",  # line too long — handled by ruff format
    "TC001", # move first-party import into TYPE_CHECKING
    "TC002", # move third-party import into TYPE_CHECKING
    "TC003", # move stdlib import into TYPE_CHECKING
]

[tool.ruff.lint.isort]
known-first-party = ["the_front_office"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Match .gitattributes (eol=lf) instead of inferring per file, so a Windows
# checkout cannot produce a diff that only changes line endings.
line-ending = "lf"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: hits a live external API (Yahoo, NBA.com or Gemini). Deselected by default; opt in with `-m integration`.",
]
# Default run is hermetic and fast — no network, no credentials required.
addopts = "-m 'not integration'"
